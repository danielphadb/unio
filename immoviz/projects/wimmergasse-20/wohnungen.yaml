# immoviz Stufe 6: Innenräume Wimmergasse 20
# Koordinaten in Planpixeln (300 dpi) der jeweiligen Planseite. Umrechnung ins lokale System über corner_px.
# Quellen: [GR] 20260424_Mappe_Wimmerg20.pdf (Buschina, 1:100, Vektor), [NWG] Nutzwertgutachten Korab 06.07.2026

plaene:
  og1:
    pdf: /root/.claude/uploads/4efdce14-7e10-5b98-9dc3-fc44cf246a5c/93c5b7f4-20260424_Mappe_Wimmerg20.pdf
    page: 4
    dpi: 300
    m_per_px: 0.0084667        # 1:100 bei 300 dpi
    cell_px: 3                 # Rasterzelle 2,5 cm
    corner_px: [4178, 2536]    # Gebäudeecke Wimmergasse/Stolberggasse (Außenkante)

# Innenraum-Lichtstimmungen (werden zu project.yaml lights ergänzt). Wimmergasse 1. OG bekommt wegen der
# Häuser gegenüber erst ab ca. 50 Grad Sonnenhöhe direkte Sonne, daher Mai frühnachmittags.
lichter:
  mai_nachmittag: {date: "2026-05-20", time: "14:30", tz: 2, exposure: 0.0, interior: 0.0, aerosol: 1.5, season: fruehling}

render:
  preview_resolution: [1200, 800]
  resolution: [2400, 1600]
  samples: 64

wohnungen:
  top07:
    plan: og1
    titel: Top 7, 1. OG, Wimmergasse (NWG 47,73 m²)
    region_px: [1600, 1380, 2650, 2560]
    solid_px: [[1830, 1420, 2300, 1880]]    # Stiegenhaus, gehört nicht zur Wohnung
    floor_z: 4.65              # Rohdecke +4,40 plus Aufbau, Annahme
    height: 3.30               # lichte Raumhöhe Altbau, ANNAHME (Schnitt fehlt)
    window: {sill: 0.92, top: 2.93}   # aus der Straßenansicht: Fenster 1.OG z 5,57 bis 7,58
    bands:
      - {type: fenster, px: [1550, 2440, 2700, 2600]}   # Straßenfassade Wimmergasse
    light: mai_nachmittag
    exposure: 1.6
    kameras:   # Shotliste mood_interior.md: S1 Essplatz zum Fenster, S2 Wohnen Gegenblick, S3 Schlafzimmer
      wohnkueche:        {pos_px: [2105, 1940], target_px: [1700, 2470], lens: 28, h: 1.35}
      wohnkueche_zurueck: {pos_px: [1720, 2400], target_px: [2110, 1930], lens: 28, h: 1.25}
      zimmer:            {pos_px: [2190, 2290], target_px: [2600, 2290], lens: 32, h: 1.10}

  top12:
    plan: og1
    titel: Top 12, 1. OG, Stolberggasse mit Loggia (NWG 53,35 m²)
    region_px: [2360, 560, 4210, 1200]
    solid_px: [[2825, 630, 2910, 690]]      # Feuermauer, Schraffurlücke ist keine Öffnung
    floor_z: 4.65
    height: 3.30
    window: {sill: 0.92, top: 2.93}
    bands:
      - {type: fenster, px: [4090, 560, 4220, 1200]}    # Straßenfassade Stolberggasse
      - {type: glastuer, px: [2540, 640, 2660, 1010]}   # Ausgang zur Loggia
    light: vormittag
    exposure: 2.2
    kameras:
      # S4 Küche: die Kochnische ist nur 1,3 m tief, frontal geht nicht, daher Schrägblick aus dem Wohnraum
      kueche:        {pos_px: [2960, 1110], target_px: [3350, 950], lens: 28, h: 1.40}
      wohnen_loggia: {pos_px: [3110, 1080], target_px: [2620, 790], lens: 28, h: 1.35}    # S5
      zimmer_ecke:   {pos_px: [3575, 1075], target_px: [4090, 760], lens: 24}

  top35:
    plan: manuell
    titel: Top 35, 3. DG, Eckwohnung mit Terrassen (NWG 60,85 m² plus 6,93 m² Terrassen)
    # Aus der plangeprüften Dachkubatur (project.yaml, dach.walls und slopes, Straßenansicht [ANS]).
    # Lokale Koordinaten: x entlang Stolberggasse, y entlang Wimmergasse ab der Ecke.
    floor_z: 21.07              # Oberkante Rohdecke DG3 +50,20 WrN
    height: 2.65                # lichte Raumhöhe laut DG-Plan RH 2,52 bis 2,68
    slab_rect: [1.8, 1.8, 8.8, 8.8]
    walls:
      - rect: [1.8, 1.8, 2.1, 8.5]          # Glasfront zur Wimmergasse (Terrasse)
        openings:
          - {span: [1.95, 2.93], z: [0.03, 2.28], type: glastuer}
          - {span: [3.03, 4.01], z: [0.03, 2.28], type: glastuer}
          - {span: [4.10, 5.08], z: [0.03, 2.28], type: glastuer}
          - {span: [5.47, 6.79], z: [0.03, 2.28], type: glastuer}
          - {span: [6.89, 8.21], z: [0.03, 2.28], type: glastuer}
      - rect: [2.1, 1.8, 5.4, 2.1]          # Glasfront zur Stolberggasse
        openings:
          - {span: [2.2, 3.4], z: [0.03, 2.28], type: glastuer}
          - {span: [3.6, 4.8], z: [0.03, 2.28], type: glastuer}
      - {rect: [5.4, 1.8, 8.3, 2.1], h: 1.32}   # Kniestock unter der Dachschräge
      - rect: [8.0, 2.1, 8.3, 8.8]
        openings: [{span: [6.3, 7.2], z: [0.0, 2.1], type: tuer}]
      - rect: [1.8, 8.5, 8.0, 8.8]
        openings: [{span: [4.2, 5.1], z: [0.0, 2.1], type: tuer}]
    slopes:
      - x: [5.4, 8.0]
        from: [2.1, 22.39]
        to: [3.25, 23.72]
        roof_windows: [{x: [6.2, 7.4], t: [0.12, 0.88]}]
    terrace:
      - {rect: [0.85, 0.85, 1.8, 8.5]}
      - {rect: [1.8, 0.85, 5.4, 1.8]}
    railings:
      - {rect: [0.83, 0.85, 0.87, 8.5]}
      - {rect: [0.85, 0.83, 5.4, 0.87]}
    light: golden_hour
    exposure: 1.4
    kameras:
      wohnen_terrasse: {pos: [7.6, 7.9], target: [2.0, 2.3], lens: 28, h: 1.35}   # S7 Essplatz mit Terrassenblick
      dachschraege:    {pos: [2.7, 7.9], target: [7.2, 2.6], lens: 24, h: 1.30}   # S6 Wohnküche unter der Schräge
      kuecheninsel:    {pos: [4.0, 4.6], target: [8.0, 4.6], lens: 50, h: 1.20}   # S8 Detail, Küche an der Rückwand
