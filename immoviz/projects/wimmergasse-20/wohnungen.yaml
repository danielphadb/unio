# immoviz Stufe 6: Innenräume Wimmergasse 20
# Koordinaten in Planpixeln (300 dpi) der jeweiligen Planseite. Umrechnung ins lokale System über corner_px.
# Quellen: [GR] 20260424_Mappe_Wimmerg20.pdf (Buschina, 1:100, Vektor), [NWG] Nutzwertgutachten Korab 06.07.2026

plaene:
  og1:
    pdf: /root/.claude/uploads/4efdce14-7e10-5b98-9dc3-fc44cf246a5c/93c5b7f4-20260424_Mappe_Wimmerg20.pdf
    page: 4
    dpi: 300
    m_per_px: 0.0084667        # 1:100 bei 300 dpi
    cell_px: 3                 # Rasterzelle 2,5 cm
    corner_px: [4178, 2536]    # Gebäudeecke Wimmergasse/Stolberggasse (Außenkante)

# Innenraum-Lichtstimmungen (werden zu project.yaml lights ergänzt). Wimmergasse 1. OG bekommt wegen der
# Häuser gegenüber erst ab ca. 50 Grad Sonnenhöhe direkte Sonne, daher Mai frühnachmittags.
lichter:
  mai_nachmittag: {date: "2026-05-20", time: "14:30", tz: 2, exposure: 0.0, interior: 0.0, aerosol: 1.5, season: fruehling}

render:
  preview_resolution: [1200, 800]
  resolution: [2400, 1600]
  samples: 64

wohnungen:
  top07:
    plan: og1
    titel: Top 7, 1. OG, Wimmergasse (NWG 47,73 m²)
    region_px: [1600, 1380, 2650, 2560]
    solid_px: [[1830, 1420, 2300, 1880]]    # Stiegenhaus, gehört nicht zur Wohnung
    floor_z: 4.65              # Rohdecke +4,40 plus Aufbau, Annahme
    height: 3.30               # lichte Raumhöhe Altbau, ANNAHME (Schnitt fehlt)
    window: {sill: 0.92, top: 2.93}   # aus der Straßenansicht: Fenster 1.OG z 5,57 bis 7,58
    bands:
      - {type: fenster, px: [1550, 2440, 2700, 2600]}   # Straßenfassade Wimmergasse
    light: mai_nachmittag
    exposure: 1.6
    kameras:   # Shotliste mood_interior.md: S1 Essplatz zum Fenster, S2 Wohnen Gegenblick, S3 Schlafzimmer
      wohnkueche:        {pos_px: [2105, 1940], target_px: [1700, 2470], lens: 28, h: 1.35}
      wohnkueche_zurueck: {pos_px: [1720, 2400], target_px: [2110, 1930], lens: 28, h: 1.25}
      zimmer:            {pos_px: [2190, 2290], target_px: [2600, 2290], lens: 32, h: 1.10}

  top12:
    plan: og1
    titel: Top 12, 1. OG, Stolberggasse mit Loggia (NWG 53,35 m²)
    region_px: [2360, 560, 4210, 1200]
    solid_px: [[2825, 630, 2910, 690]]      # Feuermauer, Schraffurlücke ist keine Öffnung
    floor_z: 4.65
    height: 3.30
    window: {sill: 0.92, top: 2.93}
    bands:
      - {type: fenster, px: [4090, 560, 4220, 1200]}    # Straßenfassade Stolberggasse
      - {type: glastuer, px: [2540, 640, 2660, 1010]}   # Ausgang zur Loggia
    light: vormittag
    exposure: 2.2
    kameras:
      # S4 Küche frontal: Kamera in der Kochnische an der Südwand, Ein-Punkt auf die Küchenzeile (Abstand 1,8 m)
      kueche:        {pos_px: [3300, 1115], target_px: [3300, 905], lens: 24, h: 1.40}
      wohnen_loggia: {pos_px: [3110, 1080], target_px: [2620, 790], lens: 28, h: 1.35}    # S5
      zimmer_ecke:   {pos_px: [3575, 1075], target_px: [4090, 760], lens: 24}

  top35:
    plan: manuell
    titel: Top 35, 3. DG, Eckwohnung mit Terrassen (NWG 60,85 m² plus 6,93 m² Terrassen)
    # Aus der plangeprüften Dachkubatur (project.yaml, dach.walls und slopes, Straßenansicht [ANS]).
    # Lokale Koordinaten: x entlang Stolberggasse, y entlang Wimmergasse ab der Ecke.
    floor_z: 21.07              # Oberkante Rohdecke DG3 +50,20 WrN
    height: 2.65                # lichte Raumhöhe laut DG-Plan RH 2,52 bis 2,68
    slab_rect: [1.8, 1.8, 8.8, 8.8]
    walls:
      - rect: [1.8, 1.8, 2.1, 8.5]          # Glasfront zur Wimmergasse (Terrasse)
        openings:
          - {span: [1.95, 2.93], z: [0.03, 2.28], type: glastuer}
          - {span: [3.03, 4.01], z: [0.03, 2.28], type: glastuer}
          - {span: [4.10, 5.08], z: [0.03, 2.28], type: glastuer}
          - {span: [5.47, 6.79], z: [0.03, 2.28], type: glastuer}
          - {span: [6.89, 8.21], z: [0.03, 2.28], type: glastuer}
      - rect: [2.1, 1.8, 5.4, 2.1]          # Glasfront zur Stolberggasse
        openings:
          - {span: [2.2, 3.4], z: [0.03, 2.28], type: glastuer}
          - {span: [3.6, 4.8], z: [0.03, 2.28], type: glastuer}
      - {rect: [5.4, 1.8, 8.3, 2.1], h: 1.32}   # Kniestock unter der Dachschräge
      - rect: [8.0, 2.1, 8.3, 8.8]
        openings: [{span: [6.3, 7.2], z: [0.0, 2.1], type: tuer}]
      - rect: [1.8, 8.5, 8.0, 8.8]
        openings: [{span: [4.2, 5.1], z: [0.0, 2.1], type: tuer}]
    slopes:
      - x: [5.4, 8.0]
        from: [2.1, 22.39]
        to: [3.25, 23.72]
        roof_windows: [{x: [6.2, 7.4], t: [0.12, 0.88]}]
    terrace:
      - {rect: [0.85, 0.85, 1.8, 8.5]}
      - {rect: [1.8, 0.85, 5.4, 1.8]}
    railings:
      - {rect: [0.83, 0.85, 0.87, 8.5]}
      - {rect: [0.85, 0.83, 5.4, 0.87]}
    light: golden_hour
    exposure: 1.4
    kameras:
      wohnen_terrasse: {pos: [7.6, 7.9], target: [2.0, 2.3], lens: 28, h: 1.35}   # S7 Essplatz mit Terrassenblick
      dachschraege:    {pos: [2.7, 7.9], target: [7.2, 2.6], lens: 24, h: 1.30}   # S6 Wohnküche unter der Schräge
      kuecheninsel:    {pos: [3.4, 4.6], target: [8.0, 4.6], lens: 35, h: 1.20}   # S8 Küche an der Rückwand, Insel davor (50 mm zeigt nur Wand)
    walkthrough:                # Kamerafahrt auf 1,5 m (Methode: Blender-Pfad, Standbilder je Wegpunkt, Videomodell verbindet)
      sekunden: 20
      light: golden_hour
      still_resolution: [1920, 1080]
      punkte:
        - {pos: [4.65, 8.25], target: [4.0, 2.0], lens: 22, t: 0}     # Eintritt in der Tür, ganzer Raum
        - {pos: [4.8, 6.6], target: [7.6, 4.0], lens: 24, t: 5}       # Blick zur Küche unter der Schräge
        - {pos: [4.5, 5.0], target: [2.0, 2.0], lens: 24, t: 10}      # Drehung zur Glasecke
        - {pos: [3.5, 3.8], target: [2.0, 7.0], lens: 24, t: 15}      # entlang der Glasfront zur Wimmergasse
        - {pos: [2.7, 2.7], target: [-3.0, -2.5], lens: 24, t: 20}    # an der Glasecke, Blick über die Dächer

# ---------------------------------------------------------------- Schnittansicht (immoviz.py schnitt)
# Gebäude Geschoss für Geschoss aufgeschnitten, eine feste Axonometrie-Kamera, Modellbau-Ästhetik.
# Höhen z über +29,13 WrN. FFB = Fußbodenoberkante laut Kote im Grundriss [GR], decke = [Unterkante, Oberkante]
# der Decke darüber (Deckenstärke 0,35 m ANNAHME, Schnitt fehlt). Fenster: Brüstung und Sturz relativ zur FFB aus
# der Straßenansicht (altbau.rows in project.yaml). Schnitthöhe je Geschoss: FFB + 1,20 m (wie Grundrissschnitt).
schnitt:
  plan_von: og1                # PDF wie plaene.og1
  dpi: 300
  m_per_px: 0.0084667
  cell_px: 3
  rand_m: 1.0                  # Planausschnitt um den Umriss
  rand_hof_m: 0.25             # Wände bis so weit außerhalb des Umrisses (Hof, Feuermauern) zulassen
  fassade_abstand_m: 0.03      # Decken erst hinter der Straßenflucht, davor steht die Hero-Fassade
  fassadenwand_m: 0.65         # Straßenwände massiv aus der Straßenansicht (Öffnungen wie altbau.rows), Planwände erst dahinter
  umriss_plus:                 # Plan zeigt Gebäude, OGD-Umriss nicht: Hoftrakt mit Loggia (Top 5/12/19/26) zwischen Hof und Feuermauer
    - [[11.47, 11.30], [16.12, 11.30], [16.12, 15.30], [11.47, 15.30]]
  fenster_zone_m: 1.0          # Öffnung näher am Umriss = Fenster, sonst Tür
  sockel_unten: -0.5
  reihenfolge: [eg, og1, og2, og3, dg3]
  geschosse:
    eg:  {page: 3, corner_px: [3925, 2420], ffb: 1.21, decke: [4.59, 4.94], fenster: {bruestung: 0.65, sturz: 2.60}}   # Kote ±0,00 = +30,34 WrN; Blatt gegenüber 1. OG verschoben
    og1: {page: 4, corner_px: [4178, 2536], ffb: 4.94, decke: [7.99, 8.34], fenster: {bruestung: 0.63, sturz: 2.64}}   # +3,73 = +34,07 WrN
    og2: {page: 5, corner_px: [4178, 2536], ffb: 8.34, decke: [11.40, 11.75], fenster: {bruestung: 0.69, sturz: 2.54}} # ANNAHME Mitte 1./3. OG, Plan zeigt kopierte Kote des 1. OG
    og3: {page: 6, corner_px: [4178, 2536], ffb: 11.75, decke: [15.30, 15.97], fenster: {bruestung: 0.66, sturz: 2.42}} # +10,67 = +40,88 WrN; darüber DG-Decke bis 16,27
    dg3:                        # kein Vektorplan: Dachkubatur aus project.yaml (dach) und Top 35 aus wohnungen.top35
      typ: dach
      ffb: 21.07
      wohnung: top35
      volumen_behalten: [0, 1, 2]   # dach.volumes: DG1, DG2, Stiegenhaus bleiben Volumen; Innenvolumen DG3 werden geöffnet
      aussenwand_m: 0.35            # Außenwand am Umriss der geöffneten DG3-Volumen (Hof, Feuermauer)
      ohne_glasfronten: true        # Glasfronten von Top 35 liefert die Dachkubatur
  wohnungen:                    # Bodenflächen in UNIO-Signalfarbe, Polygon lokal (x Stolberggasse, y Wimmergasse)
    top07:
      geschoss: og1
      titel: Top 7
      polygon: [[-0.20, 12.94], [5.70, 12.94], [5.70, 13.62], [9.40, 13.62], [9.40, 21.50], [-0.20, 21.50]]   # region_px, an Gang und Top 6/8 auf die Wandachsen gekürzt
      ohne: [[[5.55, 15.90], [9.45, 15.90], [9.45, 19.88], [5.55, 19.88]]]      # Stiegenhaus (solid_px)
    top12:
      geschoss: og1
      titel: Top 12
      polygon: [[11.31, -0.27], [16.73, -0.27], [16.73, 15.39], [13.40, 15.39], [13.40, 17.20], [11.85, 17.20], [11.85, 15.39], [11.31, 15.39]]   # region_px plus AR 1,26 m²
    top35:
      geschoss: dg3
      titel: Top 35
      polygon: [[2.1, 2.1], [8.0, 2.1], [8.0, 8.5], [2.1, 8.5]]                 # Innenraum laut wohnungen.top35.walls
  kamera:                       # Axonometrie (orthografisch) von schräg oben auf die Ecke Wimmergasse/Stolberggasse
    ziel: [7.0, 12.0, 10.0]
    azimut: 205                 # Richtung Ziel -> Kamera im lokalen System (225 = Diagonale über der Kreuzung)
    hoehe: 50
    breite: 60                  # sichtbare Breite in Metern
    abstand: 200
  licht: vormittag
  exposure: -1.0               # Weißmodell in praller Sonne, sonst brennen die Weißtöne aus
  farben: {wand: "#EDEAE4", boden: "#D3CBBE", schnitt: "#1B1A19", dach: "#B3ADA4", rahmen: "#F4F2ED"}
  zustaende:
    - {name: s00, titel: Ganzes Haus, schnitt: null}
    - {name: s01, titel: 3. Dachgeschoss, geschoss: dg3, schnitt: 22.20, wohnungen: [top35]}
    - {name: s02, titel: 3. Obergeschoss, geschoss: og3, schnitt: 12.95}
    - {name: s03, titel: 2. Obergeschoss, geschoss: og2, schnitt: 9.54}
    - {name: s04, titel: 1. Obergeschoss, geschoss: og1, schnitt: 6.14, wohnungen: [top07, top12]}
    - {name: s05, titel: Erdgeschoss, geschoss: eg, schnitt: 2.41}
  render:
    preview_resolution: [640, 400]
    preview_samples: 8
    resolution: [1920, 1080]
    samples: 48
