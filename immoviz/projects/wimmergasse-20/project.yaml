# ---------------------------------------------------------------- Baeume: Korrekturen zum Baumkataster (Abgleich 15.11.2026)
# Geprueft wurden alle Katasterbaeume im Umkreis von 60 m gegen Street View 05/2024 (belaubt) und Orthofoto Wien 2024 (unbelaubt).
# Ein Eintrag findet den Baum ueber seine Position (naechster Katasterbaum innerhalb tol, Standard 2 m).
#   remove: true                     Baum steht nicht (mehr)
#   height, crown, form, base       Hoehe, Kronendurchmesser, Form (rund | saeule), Stammhoehe bis zur Krone
#   add: true                        Baum ergaenzen, der im Kataster fehlt
# Die Saeulenhainbuchen der Stolberggasse sind alt und breit ausgewachsen, das Kataster fuehrt sie mit zu kleiner Hoehenklasse.
trees_override:
  - {pos: [8.5, -3.8], height: 13.5, crown: 9.5, form: rund, base: 3.2}   # Stolberggasse an der Ecke: breite dichte Krone bis ueber das 3. OG [SV 05/2024, Orthofoto]
  - {pos: [-4.0, 24.3], remove: true}                                      # "Jungbaum wird gepflanzt": Baumscheibe vorhanden, kein Baum [SV 05/2024, Orthofoto]
  - {pos: [-16.4, -15.0], height: 13.0, crown: 9.0, form: rund}            # Suedwestecke vor Wimmergasse 15, reicht bis zum Hauptgesims [SV 05/2024]
  - {pos: [-36.7, -14.9], height: 12.0, crown: 8.0, form: rund}            # Stolberggasse Suedseite westlich der Kreuzung [SV 05/2024]
  - {pos: [-35.9, -3.7], height: 9.0, crown: 4.5, form: rund}              # vor Stolberggasse 38, Krone breiter als Kataster [SV 05/2024]
  - {pos: [33.5, -15.0], height: 13.0, crown: 8.0, form: rund}             # Stolberggasse Suedseite, bis 4. Geschoss [SV 05/2024]
  - {pos: [47.7, -3.7], height: 13.0, crown: 9.0, form: rund}              # vor Stolberggasse 32, verdeckt die Fassade bis zum 3. OG [SV 05/2024]
  - {pos: [47.4, -15.0], height: 12.0, crown: 8.0, form: rund}             # Stolberggasse Suedseite [SV 05/2024]
  - {pos: [8.4, -14.9], height: 6.5, crown: 3.0, form: rund}               # Jungbaum vor Wimmergasse 18, schmale lichte Krone [SV 05/2024]
  # Hofbaeume (nicht im Baumkataster, das nur Strassenbaeume fuehrt): im Schraegluftbild und im Orthofoto dicht begruente Hoefe
  # hinter dem Objekt. Lage aus dem Orthofoto grob, Groesse geschaetzt.
  # Lage und Groesse nachgemessen im 3D-Abgleich 16.11.2026 (Hoehenbild der Kronen, nur Parameter): der Baum hinter
  # Stolberggasse 34 (25 / 27) existiert nicht, die uebrigen standen 4 bis 8 m daneben und waren zu hoch.
  - {add: true, pos: [44.0, 67.0], height: 14.0, crown: 9.5, form: rund}   # Hof zwischen Wimmergasse 24 und dem Hofgebaeude 009426
  - {add: true, pos: [18.0, 67.0], height: 12.5, crown: 8.0, form: rund}
  - {add: true, pos: [21.0, 52.0], height: 9.5, crown: 7.5, form: rund}
  - {add: true, pos: [40.0, 54.0], height: 7.5, crown: 7.0, form: rund}

# ---------------------------------------------------------------- Daecher: Korrekturen zum Dachmodell (Abgleich 15.11.2026)
# Das Dachmodell LOD2 der Stadt Wien liefert Form und Hoehe, das Orthofoto nur eine grobe Farbklasse. Was fehlt
# (Deckung und Farbton, Mansarden, Gauben, Dachfenster, Kamine, Brandwaende), steht hier je Gebaeude.
# Referenz nur zum Ansehen: Schraegluftbild von Suedwesten (renders/streetview/referenz_apple, nicht im Repo) und
# Street View. Alle Angaben sind Parameter (Anzahl, Groesse, Material), nichts ist aus einem Bild abgepaust.
# Ein Eintrag gilt fuer alle Baukoerperteile eines BEZUG, mit pos: [x, y] nur fuer den Teil, in dem der Punkt liegt.
#   material          Deckung der geneigten Flaechen: ziegel_rot | ziegel_orange | ziegel_braun | schiefer_dunkel |
#                     blech | blech_hell | blech_dunkel | kupfer | kies | gruen | flach
#   material_flach    Deckung der flachen Flaechen (Standard laut Dachmodell)
#   mansarde          true oder {traufe, hoehe, neigung, tiefe, material_oben, kamin: a | b | beide, brandwand_material}
#                     ersetzt Stufenvolumen bzw. Dachmodell: steile Flaechen zur Strasse und zum Hof, Flachdach, Brandwaende
#   gauben            Anzahl je Dachseite oder {anzahl, reihen, breite, hoehe, lage, seiten: ['-x', '+y', ...]}
#   dachfenster       Anzahl je Dachseite oder {anzahl, reihen, lage, seiten}
#   kamine            Anzahl je Gebaeude (nahe am First)
# seiten = Richtung, in die die Dachflaeche abfaellt (lokales System: +x Stolberggasse Richtung Nordost, +y Wimmergasse Richtung Nordwest).
roofs_override:
  # ---- Stolberggasse, Hausseite
  - bezug: "547117"            # Stolberggasse 34: schwarzes Mansarddach ueber 2 Geschosse, zwei Reihen Gauben und Dachfenster, helle Brandwand mit Kamin zum Objekt
    material: schiefer_dunkel
    # 3D-Abgleich 16.11.2026 (immoviz.py referenz): Oberkante 27,0 bis 27,4 m stimmt, die Mansardflaechen sind flacher
    # als angenommen (Hoehenbild: Haelfte der Strassentrakt-Flaeche unter 24,2 m), Neigung 68 auf 52 Grad, Traufe 0,4 m tiefer
    mansarde: {traufe: 20.3, hoehe: 6.4, neigung: 52, material_oben: blech_dunkel, kamin: a, brandwand_material: brandwand}
    gauben: {anzahl: 5, reihen: 2, breite: 1.7, hoehe: 1.5}
    dachfenster: {anzahl: 5, reihen: 2, lage: 0.2}
  - {bezug: "009425", material: ziegel_orange, kamine: 3}                                   # Stolberggasse 32: leuchtend oranges Ziegeldach
  - {bezug: "009415", material: ziegel_rot, gauben: {anzahl: 4, seiten: ["-y"]}, kamine: 3, aufbauten: [{pos: [74.2, 9.6], l: 9.3, b: 1.7, z0: 19.8, z1: 26.0, drehung: 97}]}   # Ecke Ramperstorffergasse: rotes Ziegeldach mit Gauben
  # ---- Wimmergasse, Hausseite Richtung Nordwest
  - {bezug: "009428", material: blech_hell, dachfenster: {anzahl: 5, reihen: 2, seiten: ["-x"]}}   # Wimmergasse 22: hellgraues Blechdach mit Dachflaechenfenstern
  - {bezug: "009429", material: ziegel_braun, kamine: 2}                                    # Wimmergasse 24: braunes Ziegeldach
  - {bezug: "009430", material: schiefer_dunkel, gauben: {anzahl: 4, seiten: ["-x"]}, dachfenster: {anzahl: 4, lage: 0.6, seiten: ["-x"]},   # Wimmergasse 26: dunkles Schieferdach mit Gauben
     dach: {form: sattel, traufe: 17.2, first: 23.4, richtung: laengs, min_hoehe: 15.0},
     aufbauten: [{pos: [7.9, 69.6], l: 7.1, b: 1.8, z0: 19.9, z1: 21.9, drehung: 88}, {pos: [10.9, 63.6], l: 5.8, b: 2.1, z0: 17.5, z1: 22.9, drehung: 80}]}   # 3D-Abgleich: neues Dach nach 2016, Traufe 15,7 m, First 21,3 m ueber Strasse statt 18,8 m (Dachmodell)
  - {bezug: "009431", material: ziegel_braun, kamine: 2}                                    # Wimmergasse 28
  - {bezug: "009432", material: ziegel_braun, kamine: 2}                                    # Wimmergasse 30
  # ---- Gegenseite Wimmergasse
  # Wimmergasse 17: graues Blechdach mit Dachfenstern, kein Dachmodell. 3D-Abgleich 16.11.2026: statt Schraege 16,2 bis
