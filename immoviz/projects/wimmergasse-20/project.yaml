# immoviz Projektdatei: Wimmergasse 20 / Stolberggasse 36, 1050 Wien ("Das Wimmer")
#
# Masseinheit Meter. z = 0 entspricht +29,13 WrN (Strassenniveau am Haustor laut Strassenansicht).
# u = Laufmeter entlang einer Fassade, von links nach rechts gesehen von der Strasse.
# d = Abstand nach innen hinter der Fassadenflucht (d < 0 = vor der Fassade).
#
# Quellen (siehe quellen/README.md):
#   [ANS]  06_Wimmerg_Strassenansicht.pdf, Buschina & Partner, 1:100, 10.04.2026
#   [GR]   20260424_Mappe_Wimmerg20.pdf, Grundrisse KG bis 3.OG, 24.04.2026
#   [NWG]  Nutzwertgutachten Korab 06.07.2026, Beilagen Grundrisse 1. bis 3. DG und Dachaufsicht
#   [FK]   Farbkonzept 15.04.2026 und Produktkatalog Allgemeinbereiche 22.07.2026
#   [OGD]  Stadt Wien Open Data: Baukoerpermodell, Baumkataster, Verkehrsflaechen

project:
  name: Das Wimmer
  slug: wimmergasse-20
  client: UNIO / VPH Venture Property Holding

site:
  address: Wimmergasse 20, 1050 Wien
  origin_gk: [1955.97, 338546.50]   # Gebaeudeecke Wimmergasse/Stolberggasse [OGD]
  x_axis_deg: 36.39                 # x-Achse entlang Stolberggasse [OGD]
  radius_m: 420
  detail_radius_m: 120
  hero_bezug: ["009427"]
  ground_wn: 29.13
  terrain_anchors: [[-0.22, 25.44, 0.0], [0.0, 0.0, 0.79]]   # +29,13 am Nachbarn Nr. 22, +29,92 an der Ecke [ANS]

# Fassadenfluchten im lokalen System (aus dem Baukoerpermodell, Abweichung zu [ANS] < 2 cm)
facades:
  wimmergasse:   {a: [-0.22, 25.44], b: [0.0, 0.0]}    # Laenge 25,44 m, u=0 am Nachbarn Nr. 22
  stolberggasse: {a: [0.0, 0.0], b: [16.16, 0.0]}      # Laenge 16,16 m, u=0 an der Ecke

# ---------------------------------------------------------------- Altbau (Regelgeschosse)
altbau:
  height: 16.27            # Hauptgesims Oberkante +45,40 WrN [ANS]
  core_depth: 4.0          # Tiefe, ab der der Hauskern als Volumen gebaut wird
  slabs: [4.40, 7.95, 11.60, 15.30]
  rustika: {z: [0.75, 8.0], spacing: 0.62}   # nachtraegliche Nutenfraesung EG und 1.OG [ANS]
  sockel: 0.75
  cornices:                 # [ANS] DP01, DP02, Hauptgesims
    - {name: kordon_dp01, steps: [[4.49, 4.62, 0.08], [4.62, 5.00, 0.14], [5.00, 5.18, 0.20]]}
    - {name: kordon_dp02, steps: [[8.00, 8.85, 0.04], [8.85, 9.03, 0.18]]}
    - {name: sohlbank_3og, steps: [[12.22, 12.38, 0.08]]}
    - {name: hauptgesims, steps: [[14.70, 15.45, 0.03], [15.45, 15.60, 0.12], [15.60, 15.86, 0.25], [15.86, 16.05, 0.45], [16.05, 16.27, 0.62]], consoles: {z: [15.45, 15.86], w: 0.16, proj: 0.42}}
  rows:                     # Fensterreihen [ANS]
    eg:  {z: 1.86, h: 1.95, w: 0.95, type: kastenfenster, surround: fasche}
    og1: {z: 5.57, h: 2.01, w: 1.05, type: kastenfenster, surround: fasche_verdachung}
    og2: {z: 9.03, h: 1.85, w: 1.05, type: kastenfenster, surround: aedikula}
    og3: {z: 12.41, h: 1.76, w: 1.05, type: kastenfenster, surround: fasche}
  facades:
    wimmergasse:
      axes: [1.60, 3.65, 5.71, 7.76, 9.81, 11.86, 13.81, 15.87, 17.92, 19.97, 21.93, 23.98]   # 12 Achsen [ANS]
      endcaps: [0.0]
      eg:                      # Erdgeschoss abweichend von der Regelreihe [ANS]
        - {axes: [0], type: haustor, u: [0.66, 2.44], z: [0.0, 3.81]}
        - {axes: [1, 3], type: schaufenster, z: [0.15, 3.81]}          # neue VSG-Tueren unter dem Fenster [ANS]
        - {axes: [2, 4, 5], type: kastenfenster, keller: true}
        - {axes: [6, 7, 8, 9, 10, 11], type: schaufenster, z: [0.78, 3.81]}   # Lokal, Unterkante laut [ANS]
    stolberggasse:
      axes: [2.08, 4.16, 6.24, 8.32, 10.40, 12.48, 14.56]   # 7 Achsen, gemessen im 1.OG-Grundriss [GR]
      endcaps: [16.16]
      eg:                      # ANNAHME: Lokal an der Ecke mit Schaufenstern, Rest Fenster. Ansicht Stolberggasse fehlt.
        - {axes: [0, 1, 2], type: schaufenster, z: [0.85, 3.81]}
        - {axes: [3, 4, 5, 6], type: kastenfenster, keller: true}

# ---------------------------------------------------------------- Dachgeschosse (vereinfachte Kubatur)
# DG1 + DG2 sichtbar von +45,40 bis +50,20 WrN (z 16,27 bis 21,07), DG3 bis +53,41 WrN (z 24,28) [ANS][NWG]
# Fensterpositionen aus [ANS]. Tiefen und Ruecksprunge ANNAHME nach [NWG], zu pruefen mit Schnitt/Ansicht Stolberggasse.
dach:
