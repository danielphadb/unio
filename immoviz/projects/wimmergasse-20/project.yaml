  frame: rahmen_dunkel
  walls:
    - {facade: wimmergasse, u: [7.0, 24.74], z: [16.27, 21.07], d: 0.7,
       windows: [
         {u: [8.25, 9.28], z: [16.40, 17.30]}, {u: [8.25, 9.28], z: [17.90, 20.20]},
         {u: [11.30, 12.32], z: [16.40, 17.30]}, {u: [11.30, 12.32], z: [17.90, 20.20]},
         {u: [17.23, 18.12], z: [16.40, 17.30]}, {u: [17.23, 18.12], z: [17.90, 20.20]},
         {u: [18.30, 19.30], z: [16.40, 17.30]}, {u: [18.30, 19.30], z: [17.90, 20.20]},
         {u: [20.36, 21.34], z: [16.40, 17.30]}, {u: [20.36, 21.34], z: [17.90, 20.20]},
         {u: [21.43, 22.41], z: [16.40, 17.30]}, {u: [21.43, 22.41], z: [17.90, 20.20]},
         {u: [22.51, 23.49], z: [16.40, 17.30]}, {u: [22.51, 23.49], z: [17.90, 20.20]},
         {u: [23.58, 24.56], z: [16.40, 17.30]}, {u: [23.58, 24.56], z: [17.90, 20.20]}],
       loggias: [{u: [13.00, 16.60], z: [16.27, 20.40], depth: 1.6, slab: 17.60, rail: [17.80, 18.90]}]}
    - {facade: stolberggasse, u: [0.7, 16.16], z: [16.27, 21.07], d: 0.7, axes_from: altbau, w: 1.0,
       rows: [[16.40, 17.30], [17.90, 20.20]]}
    - {facade: wimmergasse, u: [16.9, 23.64], z: [21.07, 24.28], d: 1.8,
       windows: [{u: [17.23, 18.55], z: [21.10, 23.35]}, {u: [18.65, 19.97], z: [21.10, 23.35]},
                 {u: [20.36, 21.34], z: [21.10, 23.35]}, {u: [21.43, 22.41], z: [21.10, 23.35]},
                 {u: [22.51, 23.49], z: [21.10, 23.35]}]}
    - {facade: stolberggasse, u: [1.8, 5.4], z: [21.07, 24.28], d: 1.8,
       windows: [{u: [2.2, 3.4], z: [21.10, 23.35]}, {u: [3.6, 4.8], z: [21.10, 23.35]}]}
  slopes:
    - {facade: wimmergasse, u: [0.0, 7.0], z: [16.27, 21.07], d: [0.7, 2.45],
       roof_windows: [{u: [1.07, 2.38], z: [16.45, 17.50]}, {u: [1.07, 2.38], z: [18.40, 19.90]},
                      {u: [5.02, 6.35], z: [16.45, 17.50]}, {u: [5.02, 6.35], z: [18.40, 19.90]}]}
    - {facade: wimmergasse, u: [7.2, 16.9], z: [21.07, 24.28], d: [0.9, 3.4],
       roof_windows: [{u: [11.18, 12.45], z: [21.60, 23.10]}, {u: [13.13, 14.50], z: [21.60, 23.10]},
                      {u: [15.18, 16.55], z: [21.60, 23.10]}]}
    - {facade: stolberggasse, u: [5.4, 16.16], z: [21.07, 24.28], d: [0.7, 4.1],
       roof_windows: [{u: [7.4, 8.74], z: [21.60, 23.10]}, {u: [10.6, 11.94], z: [21.60, 23.10]},
                      {u: [13.8, 15.14], z: [21.60, 23.10]}]}
  railings:
    - {facade: wimmergasse, u: [16.9, 24.59], z: 21.07, d: 0.85, h: 1.10, type: glas}
    - {facade: wimmergasse, u: [0.3, 7.2], z: 21.07, d: 2.6, h: 1.10, type: glas}      # Dachterrasse links [ANS]
    - {facade: stolberggasse, u: [0.85, 5.4], z: 21.07, d: 0.85, h: 1.10, type: glas}
