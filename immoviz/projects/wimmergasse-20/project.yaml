    - {z: [21.07, 24.28], clip: [[wimmergasse, d, ">=", 3.3], [wimmergasse, u, ">=", 16.9], [stolberggasse, u, "<=", 5.4], [stolberggasse, d, ">=", 3.3]]}
    - {z: [21.07, 24.28], clip: [[wimmergasse, d, ">=", 3.3], [wimmergasse, u, ">=", 16.9], [stolberggasse, u, ">=", 5.4], [stolberggasse, d, ">=", 4.1]]}
