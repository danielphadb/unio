    - {z: 24.28, t: 0.30, clip: [[wimmergasse, d, ">=", 3.4], [wimmergasse, u, ">=", 7.2], [wimmergasse, u, "<=", 16.9], [stolberggasse, d, ">=", 4.1]]}
