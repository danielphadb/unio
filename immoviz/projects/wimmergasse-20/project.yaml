  "009453": "#DAD8D2"   # gegenueber Stolberggasse West: weisser Bau
  "009446": "#C99486"   # gegenueber Stolberggasse Ost: rosa Gruenderzeitbau
  "009479": "#A3A099"   # Suedwestecke: grauer Gruenderzeitbau mit Stuck
  "547117": "#C3BBAF"   # Stolberggasse 34: grau-beige, dunkle Metallbalkone, dunkles Sockelband
  "009428": "#D2BF94"   # Wimmergasse 22: cremegelb, reicher Stuck
  "009426": "#E6E3DC"   # Hofgebaeude hinter dem Objekt: weiss (Schraegluftbild)
street:
  parking_material: pflaster   # Parkstreifen in beiden Gassen mit Granitpflaster
  # Parkordnung je Parkstreifen, geprüft am Orthofoto 2024 (immoviz.py strasse, renders/check/strasse_abgleich.jpg).
  # Die erste passende Regel gilt, ohne Regel entscheidet die Streifenbreite. art: laengs | schraeg | senkrecht | keine.
  # strasse = Name aus facades (Streifen parallel zur Flucht), seite: haus | gegenueber, optional bereich: [x0, y0, x1, y1].
  parking:
    # Wimmergasse Ostseite (vor dem Haus und suedlich der Kreuzung): Schraegparker, markierte Linien, rund 55 Grad.
    # Negativer Winkel: Einbahn Richtung Sueden, das bordsteinseitige Ende zeigt zur Kreuzung.
    - {name: Wimmergasse Hausseite, strasse: wimmergasse, seite: haus, art: schraeg, winkel: -55, raster: 2.35}
    - {name: Wimmergasse gegenueber, strasse: wimmergasse, seite: gegenueber, art: laengs}
    # Stolberggasse beidseitig 90 Grad zum Randstein, oestlich und westlich der Kreuzung
    - {name: Stolberggasse beidseitig, strasse: stolberggasse, art: senkrecht, raster: 2.6}
  cables:   # alt, nur Fallback ohne Inventar strassenleuchten: Seilleuchten quer ueber die Fahrbahn [x0, y0, x1, y1], Hoehe 7,5 m
    - [0.0, 0.5, -15.0, -17.5]        # Kreuzung diagonal
    - [0.0, 36.0, -15.0, 36.0]
    - [0.0, 68.0, -15.0, 68.0]
    - [0.0, -46.0, -15.0, -46.0]
    - [30.0, 0.0, 30.0, -18.0]
    - [62.0, 0.0, 62.0, -18.0]
    - [-42.0, 0.0, -42.0, -18.0]

