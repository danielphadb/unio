  # (1) Schlachthausgasse 11 / Schnirchgasse 2. Runde 5: Vorlage Hof_fin zeigt Traufe 19 bis 20 und Ziegeldach bis rund +23 (Strahlschnitt);
  # vorher Flachdach Kies nach Apple 9/10/11 (Bestand). Vorlage hat Vorrang (Kundenwunsch), Widerspruch in umgebung_abgleich.md 9
