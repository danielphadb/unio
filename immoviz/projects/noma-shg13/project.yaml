# Projektvisualisierungen; Reihenfolge der Quellen: Einreichplan > Orthofoto/LOD2 > Apple > Visualisierung. Geometrie aus
# LOD2 bleibt, korrigiert werden Deckung, Gauben und Kamine (umgebung_abgleich.md Abschnitt 8, Nummern in Klammern).
