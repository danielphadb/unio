# immoviz Projektdatei: NOMA, Schlachthausgasse 13 & Wuertzlerstrasse 10, 1030 Wien
#
# Masseinheit Meter. z = 0 entspricht +-0,00 = +4,15 m ueber Wiener Null (FOK EG Strassenhaus laut [EIN] S. 22/25).
# Lokales System: Ursprung = Westecke Strassenhaus an der Schlachthausgasse (Grenze zu Nr. 11), x entlang der
# Schlachthausgasse nach Nordost, y = Richtung Strasse. Das Grundstueck liegt bei y < 0 und reicht bis zur
# Wuertzlerstrasse (y ca. -85). Die Seiten 8, 9 und 13 der Einreichmappe liegen deckungsgleich in diesem System:
# x = (3075 - py) * 0,0084667, y = (1158 - px) * 0,0084667 (Pixel bei 300 dpi, Liftschacht in allen Blaettern gleich).
#
# Hofrahmen `hof` (Abschnitt neubau.rahmen): Ursprung = Suedwestecke Pavillon Top 3 aussen [EIN S. 9], a entlang der
# Pavillonreihe Richtung Wuertzlerstrasse, b quer nach Nordost. Die Pavillons stehen 6,44 Grad gedreht zum Strassenhaus.
#
# Quellen (siehe README.md im Projektordner):
#   [EIN]  SHG13 Planungsmappe Einreichung, Vorabzug 04.03.2026, Hawlik Gerginski (Seite der Mappe, 1:100/1:200)
#   [VP]   Verkaufsplaene NOMA (UNIO hero), A3 je Top. Massstab rund 1:60, die Massleiste 0 bis 5 m stimmt NICHT
#          (kalibriert ueber Pavillonlaenge 11,95 m und Tiefe 6,62 m laut [EIN S. 15])
#   [BAB]  Bau- und Ausstattungsbeschreibung hofseitig + DG + Lofts, 02.02.2026
#   [OGD]  Stadt Wien Open Data: Baukoerpermodell, Baumkataster, Verkehrsflaechen, Dachmodell LOD2, Orthofoto 2024
#   [ANN]  Annahme (im README begruendet)

project:
  name: NOMA Schlachthausgasse 13
  slug: noma-shg13
  client: UNIO / Trattner & Soehne (Architektur Hawlik Gerginski)

site:
  address: Schlachthausgasse 13      # ohne ", 1030 Wien": mit Postleitzahl liefert der Adressdienst nur die Strassenmitte
  origin_gk: [5681.857, 339675.845]  # Westecke Strassenfront (Grenze zu Schlachthausgasse 11) [OGD BKM 4003912165]
  x_axis_deg: 37.32                  # Strassenfront Schlachthausgasse, 18,48 m [OGD], deckt sich mit F 18,48 [EIN S. 9]
  radius_m: 420
  detail_radius_m: 120
  hero_bezug: ["005373", "504165"]   # Bestand auf dem Grundstueck (Werkstatt, Hofbauten) und Wuertzlerstr. 10 (Flugdach)
  ground_wn: 4.15                    # +-0,00 = +4,15 ue. WN [EIN S. 22/25]

facades:
  schlachthausgasse: {a: [18.48, 0.0], b: [0.0, 0.0]}     # Strassenfront, Gebaeude links (y < 0) [EIN S. 9]

# ---------------------------------------------------------------- Neubau (lib/neubau.py)
# Gruppen: nb_shg (Strassenhaus), nb_shg_dach (Mansarde, Dachterrassen), nb_hof (EG-Hoftrakt, Gruendach, Wege),
# nb_top3, nb_top4, nb_top4a (Pavillons 1. OG), nb_wue (Wuertzlerstrasse 10), nb_umgebung (Nachbargaerten),
# nb_garten (Gartenstreifen Sued mit Zaun und Straeuchern)
neubau:
  fensterrahmen: rahmen_dunkel        # Kunststoff-Alu aussen anthrazit [BAB 3.5]
  rahmen:
    hof: {ursprung: [5.058, -22.272], drehung: -83.56}    # Pavillon Top 3 Suedwestecke, Achse 6,44 Grad zum Strassenhaus [EIN S. 9]
  material:
    nb_wand_hof: {color: "#A9B092", art: putz}            # Hoffassade hellgruen-grau (Baumit 1026 laut [EIN S. 25/27]) [ANN Farbwert]
    nb_basalt: {color: "#3A3D3F", art: metall, rough: 0.5, metal: 0.3}   # RAL 7012 Basaltgrau: Erker, Gelaender [EIN S. 25]
    nb_mansarde: {color: "#55595C", art: zink}            # Mansarde Blech dunkelgrau [EIN S. 25: RAL 7012] [ANN]
    nb_brandwand: {color: "#B9B3A8", art: putz}
    nb_strasse: {color: "#C9C0A8", art: putz}             # Strassenfassade, erhaltene Gruenderzeitfassade EG/1.OG [BAB S. 2] [ANN Farbe]
    # Runde 3 (Abgleich Orthofoto 2024 und Google-Luftbild, umgebung_abgleich.md Abschnitt 7)
    nb_fallschutz: {color: "#3B3532", art: einfach, rough: 0.95}    # Spielflaeche Fallschutz dunkel, Nachbargarten
    nb_mulch: {color: "#5C4636", art: kies}                         # Beet/Rindenmulch, Nachbargarten Sued
    nb_huette: {color: "#8E9499", art: metall, rough: 0.6, metal: 0.2}   # Gartenhuette Blech grau
    nb_trog: {color: "#8C8A84", art: putz}                          # Blumentrog Beton 70 cm [EIN S. 8]
    nb_weiss: {color: "#E6E4DE", art: putz}                         # weisser Kasten Nachbargarten
  koerper:
    # --- Strassenhaus Schlachthausgasse 13 [EIN S. 9, 22, 25]: 15,00 m tief, Traufe +21,00, Strassen- und Hofseite als Fassade
    - {gruppe: nb_shg, poly: [[0.0, 0.0], [18.48, 0.0], [19.55, -15.0], [0.80, -15.0]], z: [0.0, 21.0], wand: nb_brandwand,
       dach: dach_flach, ohne_kanten: [0, 2]}
    # Erker Hofseite: Balkonstapel u 2,8 bis 15,3 vor der Hoffassade, 1,12 m tief, UK +6,94 bis +18,93 [EIN S. 22/25]
    - {gruppe: nb_shg, poly: [[3.6, -15.0], [3.9, -15.0], [3.9, -16.12], [3.6, -16.12]], z: [6.60, 20.04], wand: nb_basalt, dach: nb_basalt}
    - {gruppe: nb_shg, poly: [[15.8, -15.0], [16.1, -15.0], [16.1, -16.12], [15.8, -16.12]], z: [6.60, 20.04], wand: nb_basalt, dach: nb_basalt}
    # Gauben Hofseite 2. DG (je drei Fenster 0,94 x 2,52) Top 26 West, Top 23 Ost, Front buendig mit dem Erker [EIN S. 13]
    - {gruppe: nb_shg_dach, poly: [[1.85, -15.0], [5.05, -15.0], [5.05, -16.12], [1.85, -16.12]], z: [21.0, 24.45], wand: nb_mansarde, dach: nb_mansarde, ohne_kanten: [2]}
    - {gruppe: nb_shg_dach, poly: [[14.55, -15.0], [17.75, -15.0], [17.75, -16.12], [14.55, -16.12]], z: [21.0, 24.45], wand: nb_mansarde, dach: nb_mansarde, ohne_kanten: [2]}
    # Gauben Strassenseite 2. DG (Top 26: AR, Bad, SZ; Top 23: zwei) [EIN S. 13]
    - {gruppe: nb_shg_dach, poly: [[8.75, -0.35], [9.85, -0.35], [9.85, -1.6], [8.75, -1.6]], z: [21.3, 24.45], wand: nb_mansarde, dach: nb_mansarde, ohne_kanten: [0]}
    - {gruppe: nb_shg_dach, poly: [[4.55, -0.35], [5.65, -0.35], [5.65, -1.6], [4.55, -1.6]], z: [21.3, 24.45], wand: nb_mansarde, dach: nb_mansarde, ohne_kanten: [0]}
    - {gruppe: nb_shg_dach, poly: [[2.15, -0.35], [3.25, -0.35], [3.25, -1.6], [2.15, -1.6]], z: [21.3, 24.45], wand: nb_mansarde, dach: nb_mansarde, ohne_kanten: [0]}
    - {gruppe: nb_shg_dach, poly: [[12.70, -0.35], [13.80, -0.35], [13.80, -1.6], [12.70, -1.6]], z: [21.3, 24.45], wand: nb_mansarde, dach: nb_mansarde, ohne_kanten: [0]}
    - {gruppe: nb_shg_dach, poly: [[15.85, -0.35], [16.95, -0.35], [16.95, -1.6], [15.85, -1.6]], z: [21.3, 24.45], wand: nb_mansarde, dach: nb_mansarde, ohne_kanten: [0]}
    # Liftueberfahrt und Dachausstiege [EIN S. 14, VP Top 26-3]
    - {gruppe: nb_shg_dach, poly: [[8.0, -8.55], [10.05, -8.55], [10.05, -10.65], [8.0, -10.65]], z: [25.0, 26.75], wand: nb_mansarde, dach: nb_rasen}
    # --- Hoftrakt EG (Apartments) bis zur Rueckfassade Wuertzlerstrasse, Gruendach-Unterkante [EIN S. 8, 15, 23]
    - {gruppe: nb_hof, rahmen: hof, poly: [[-7.15, 0.0], [48.0, 0.0], [48.0, 13.9], [17.6, 14.6], [17.6, 12.54], [0.64, 12.54], [0.64, 15.09], [-5.46, 15.09]],
       z: [0.0, 3.38], wand: nb_wand_hof, dach: dach_flach, ohne_kanten: [0]}
    # --- Pavillons 1. OG: FOK +3,50, DUK +6,01, OK Attika +6,78 [EIN S. 22 Schnitt 1]; Laenge 11,95, Tiefe 6,62 [EIN S. 15, VP]
    - {gruppe: nb_top3, rahmen: hof, poly: [[0.0, 0.0], [11.95, 0.0], [11.95, 6.62], [0.0, 6.62]], z: [3.38, 6.61], wand: nb_wand_hof, dach: dach_flach, ohne_kanten: [0, 1, 2, 3]}
    - {gruppe: nb_top4, rahmen: hof, poly: [[16.04, 0.0], [27.99, 0.0], [27.99, 6.62], [16.04, 6.62]], z: [3.38, 6.61], wand: nb_wand_hof, dach: dach_flach, ohne_kanten: [0, 1, 2, 3]}
    # Top 4A: Ostwand schraeg laut [VP Top 4A] (Plan 2382..4474 px oben, 2382..3987 px unten bei 0,005072 m/px)
    - {gruppe: nb_top4a, rahmen: hof, poly: [[30.88, 0.0], [38.99, 0.0], [41.46, 6.62], [30.88, 6.62]], z: [3.38, 6.61], wand: nb_wand_hof, dach: dach_flach, ohne_kanten: [0, 2]}
    # --- Wuertzlerstrasse 10 [EIN S. 27, OGD]: 12,4 m breit, 15,00 m tief, Traufe +17,28, Mansarde bis +20,72
    - {gruppe: nb_wue, poly: [[9.1, -85.3], [21.3, -84.3], [20.6, -69.4], [8.0, -70.3]], z: [0.0, 17.28], wand: nb_wand_hof, dach: dach_flach, ohne_kanten: [2]}
    # Runde 3 (Orthofoto 2024 entzerrt, Google-Luftbild): weisser Kasten mit hellem Dach x -4,0 bis -1,0 / y -37,5 bis -45,5
    # (Vorlage Hof_fin: Betonkasten mit Gitter, vermutlich Lueftung) [ANN Hoehe 1,2], danach niedrige Mauer/Sitzkante bis y -53,5 [ANN 0,6]
    - {gruppe: nb_umgebung, poly: [[-4.0, -37.5], [-1.0, -37.5], [-1.0, -45.5], [-4.0, -45.5]], z: [0.0, 1.35], wand: nb_weiss, dach: nb_attika}
    - {gruppe: nb_umgebung, poly: [[-4.3, -45.5], [-1.3, -45.5], [-1.3, -53.5], [-4.3, -53.5]], z: [0.0, 0.75], wand: nb_brandwand, dach: nb_brandwand}
    # Gartenhuette Spielplatz (Blech grau, 2,0 x 3,6 m) und niedriger Kasten am Beet [Orthofoto, Google] [ANN Hoehen]
    - {gruppe: nb_umgebung, poly: [[-12.75, -35.5], [-10.75, -35.5], [-10.75, -39.1], [-12.75, -39.1]], z: [0.0, 2.15], wand: nb_huette, dach: nb_huette}
    - {gruppe: nb_umgebung, poly: [[-10.5, -53.8], [-8.75, -53.8], [-8.75, -57.5], [-10.5, -57.5]], z: [0.0, 0.75], wand: nb_huette, dach: nb_huette}
    # Runde 3: polygonale Erkertuerme der Hoftrakte Schlachthausgasse 15 (005379) und Wuertzlerstrasse (005380), weiss, Zeltdach
    # dunkel [Google 3D, Orthofoto: Dach 6 m breit; BKM-Erker wird von der Fassadenkarte abgeschnitten]. Vorderkante mit Fenstern unten
    - {gruppe: nb_umgebung, poly: [[24.3, -30.4], [23.2, -31.0], [22.6, -32.4], [22.6, -36.0], [23.2, -37.4], [25.6, -38.0]], z: [0.0, 16.3], wand: nb_weiss, dach: nb_mansarde, ohne_kanten: [2, 5]}
    - {gruppe: nb_umgebung, poly: [[28.2, -51.8], [25.4, -52.4], [24.4, -53.4], [24.4, -56.6], [25.4, -57.4], [28.6, -57.8]], z: [0.0, 15.9], wand: nb_weiss, dach: nb_mansarde, ohne_kanten: [2, 5]}
  fassaden:
    # --- Strassenhaus Hoffassade y = -15,00, u = x - 0,80 [EIN S. 25: Fensterachsen abgelesen 1:100]
    - gruppe: nb_shg
      a: [0.80, -15.0]
      b: [19.55, -15.0]
      z: [3.38, 21.0]
      wand: nb_wand_hof
      reihen:
        - {z: [4.88, 6.33], u: [[1.05, 2.05], [16.65, 17.65]]}                      # 1. OG FOK +3,98
        - {z: [3.98, 6.33], u: [[5.7, 7.9], [9.3, 11.5]], typ: tuer}
        - {z: [4.88, 6.33], u: [[3.9, 4.9], [13.0, 14.0]]}
        - {z: [8.32, 9.77], u: [[1.05, 2.05], [16.65, 17.65], [3.9, 4.9], [13.0, 14.0]]}   # 2. OG FOK +7,42
        - {z: [7.42, 9.77], u: [[5.7, 7.9], [9.3, 11.5]], typ: tuer}
        - {z: [11.20, 12.65], u: [[1.05, 2.05], [16.65, 17.65], [3.9, 4.9], [13.0, 14.0]]} # 3. OG FOK +10,30
        - {z: [10.30, 12.65], u: [[5.7, 7.9], [9.3, 11.5]], typ: tuer}
        - {z: [14.08, 15.53], u: [[1.05, 2.05], [16.65, 17.65], [3.9, 4.9], [13.0, 14.0]]} # 4. OG FOK +13,18
        - {z: [13.18, 15.53], u: [[5.7, 7.9], [9.3, 11.5]], typ: tuer}
        - {z: [16.96, 18.41], u: [[1.05, 2.05], [16.65, 17.65], [3.9, 4.9], [13.0, 14.0]]} # 5. OG FOK +16,06
        - {z: [16.06, 18.41], u: [[5.7, 7.9], [9.3, 11.5]], typ: tuer}
        - {z: [19.10, 20.80], u: [[1.05, 2.05], [16.65, 17.65]]}                    # 1. DG FOK +18,94 in der Fassade
        - {z: [18.94, 20.80], u: [[3.9, 4.9], [5.7, 7.9], [9.3, 11.5], [13.0, 14.0]], typ: tuer}
    # Strassenfassade y = 0 (nur Kulisse fuer Luftbilder), u = 18,48 - x, 7 Achsen [ANN, Ansicht S. 24 nicht ausgewertet]
    - gruppe: nb_shg
      a: [18.48, 0.0]
      b: [0.0, 0.0]
      z: [0.0, 21.0]
      wand: nb_strasse
      reihen:
        - {z: [1.2, 3.4], u: [[1.0, 2.2], [3.65, 4.85], [6.3, 7.5], [8.95, 10.15], [11.6, 12.8], [14.25, 15.45]]}
        - {z: [4.9, 6.9], u: [[1.0, 2.2], [3.65, 4.85], [6.3, 7.5], [8.95, 10.15], [11.6, 12.8], [14.25, 15.45], [16.6, 17.6]]}
        - {z: [8.3, 9.8], u: [[1.0, 2.2], [3.65, 4.85], [6.3, 7.5], [8.95, 10.15], [11.6, 12.8], [14.25, 15.45], [16.6, 17.6]]}
        - {z: [11.2, 12.7], u: [[1.0, 2.2], [3.65, 4.85], [6.3, 7.5], [8.95, 10.15], [11.6, 12.8], [14.25, 15.45], [16.6, 17.6]]}
        - {z: [14.1, 15.6], u: [[1.0, 2.2], [3.65, 4.85], [6.3, 7.5], [8.95, 10.15], [11.6, 12.8], [14.25, 15.45], [16.6, 17.6]]}
        - {z: [17.0, 18.5], u: [[1.0, 2.2], [3.65, 4.85], [6.3, 7.5], [8.95, 10.15], [11.6, 12.8], [14.25, 15.45], [16.6, 17.6]]}
        - {z: [19.1, 20.6], u: [[1.0, 2.2], [3.65, 4.85], [6.3, 7.5], [8.95, 10.15], [11.6, 12.8], [14.25, 15.45], [16.6, 17.6]]}
    # Gaubenfronten Hofseite 2. DG FOK +21,82, Fenster 0,94 x 2,52 [EIN S. 13]
    - {gruppe: nb_shg_dach, a: [1.85, -16.12], b: [5.05, -16.12], z: [21.0, 24.45], wand: nb_mansarde, karte_tiefe: 2.0,
       fenster: [{u: [0.13, 1.04], z: [21.82, 24.34], typ: tuer}, {u: [1.18, 2.10], z: [21.82, 24.34], typ: tuer}, {u: [2.17, 3.10], z: [21.82, 24.34], typ: tuer}]}
    - {gruppe: nb_shg_dach, a: [14.55, -16.12], b: [17.75, -16.12], z: [21.0, 24.45], wand: nb_mansarde, karte_tiefe: 2.0,
       fenster: [{u: [0.13, 1.04], z: [21.82, 24.34], typ: tuer}, {u: [1.18, 2.10], z: [21.82, 24.34], typ: tuer}, {u: [2.17, 3.10], z: [21.82, 24.34], typ: tuer}]}
    # Gaubenfronten Strassenseite (y = -0,35, hinter der Traufe)
    - {gruppe: nb_shg_dach, a: [9.85, -0.35], b: [8.75, -0.35], z: [21.3, 24.45], wand: nb_mansarde, fenster: [{u: [0.08, 1.02], z: [21.82, 24.34], typ: tuer}]}
    - {gruppe: nb_shg_dach, a: [5.65, -0.35], b: [4.55, -0.35], z: [21.3, 24.45], wand: nb_mansarde, fenster: [{u: [0.08, 1.02], z: [21.82, 24.34], typ: tuer}]}
    - {gruppe: nb_shg_dach, a: [3.25, -0.35], b: [2.15, -0.35], z: [21.3, 24.45], wand: nb_mansarde, fenster: [{u: [0.08, 1.02], z: [21.82, 24.34], typ: tuer}]}
    - {gruppe: nb_shg_dach, a: [13.80, -0.35], b: [12.70, -0.35], z: [21.3, 24.45], wand: nb_mansarde, fenster: [{u: [0.08, 1.02], z: [21.82, 24.34], typ: tuer}]}
