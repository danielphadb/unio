     aufbauten: [{pos: [27.5, -14.0], l: 3.2, b: 2.6, z1: 24.3, z0: 21.6, material: blech_hell}, {pos: [26.0, -4.5], l: 4.0, b: 3.0, z1: 24.0, z0: 21.6, material: blech_hell}]}
