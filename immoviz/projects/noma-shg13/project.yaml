# immoviz Projektdatei: NOMA, Schlachthausgasse 13 & Wuertzlerstrasse 10, 1030 Wien
#
# Masseinheit Meter. z = 0 entspricht +-0,00 = +4,15 m ueber Wiener Null (FOK EG Strassenhaus laut [EIN] S. 22/25).
# Lokales System: Ursprung = Westecke Strassenhaus an der Schlachthausgasse (Grenze zu Nr. 11), x entlang der
# Schlachthausgasse nach Nordost, y = Richtung Strasse. Das Grundstueck liegt bei y < 0 und reicht bis zur
# Wuertzlerstrasse (y ca. -85). Die Seiten 8, 9 und 13 der Einreichmappe liegen deckungsgleich in diesem System:
# x = (3075 - py) * 0,0084667, y = (1158 - px) * 0,0084667 (Pixel bei 300 dpi, Liftschacht in allen Blaettern gleich).
#
# Hofrahmen `hof` (Abschnitt neubau.rahmen): Ursprung = Suedwestecke Pavillon Top 3 aussen [EIN S. 9], a entlang der
# Pavillonreihe Richtung Wuertzlerstrasse, b quer nach Nordost. Die Pavillons stehen 6,44 Grad gedreht zum Strassenhaus.
#
# Quellen (siehe README.md im Projektordner):
#   [EIN]  SHG13 Planungsmappe Einreichung, Vorabzug 04.03.2026, Hawlik Gerginski (Seite der Mappe, 1:100/1:200)
#   [VP]   Verkaufsplaene NOMA (UNIO hero), A3 je Top. Massstab rund 1:60, die Massleiste 0 bis 5 m stimmt NICHT
#          (kalibriert ueber Pavillonlaenge 11,95 m und Tiefe 6,62 m laut [EIN S. 15])
#   [BAB]  Bau- und Ausstattungsbeschreibung hofseitig + DG + Lofts, 02.02.2026
#   [OGD]  Stadt Wien Open Data: Baukoerpermodell, Baumkataster, Verkehrsflaechen, Dachmodell LOD2, Orthofoto 2024
#   [ANN]  Annahme (im README begruendet)

project:
  name: NOMA Schlachthausgasse 13
  slug: noma-shg13
  client: UNIO / Trattner & Soehne (Architektur Hawlik Gerginski)

site:
  address: Schlachthausgasse 13      # ohne ", 1030 Wien": mit Postleitzahl liefert der Adressdienst nur die Strassenmitte
  origin_gk: [5681.857, 339675.845]  # Westecke Strassenfront (Grenze zu Schlachthausgasse 11) [OGD BKM 4003912165]
  x_axis_deg: 37.32                  # Strassenfront Schlachthausgasse, 18,48 m [OGD], deckt sich mit F 18,48 [EIN S. 9]
  radius_m: 420
  detail_radius_m: 120
  hero_bezug: ["005373", "504165"]   # Bestand auf dem Grundstueck (Werkstatt, Hofbauten) und Wuertzlerstr. 10 (Flugdach)
  ground_wn: 4.15                    # +-0,00 = +4,15 ue. WN [EIN S. 22/25]

facades:
  schlachthausgasse: {a: [18.48, 0.0], b: [0.0, 0.0]}     # Strassenfront, Gebaeude links (y < 0) [EIN S. 9]

