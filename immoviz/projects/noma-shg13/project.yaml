      a: [-7.15, 0.0]
      b: [48.0, 0.0]
      z: [0.0, 4.16]
      wand: nb_wand_hof
      reihen:
        - {z: [0.90, 2.40], u: [[4.85, 6.45], [8.55, 10.15], [15.41, 17.01], [19.11, 20.71], [25.97, 27.57], [29.67, 31.27], [36.53, 38.13], [40.23, 41.83], [47.09, 48.69], [50.79, 52.39]]}
    # --- Pavillon Top 3 (Hofrahmen): Fenster aus [VP Top 3] (Brüstung 0,90, Sturz 2,40 ueber FOK +3,50 laut 160/150 [EIN S. 15])
    - {gruppe: nb_top3, rahmen: hof, a: [0.0, 0.0], b: [11.95, 0.0], z: [3.38, 6.78], wand: nb_wand_hof,          # Sued: SZ, SZ, WZ
       fenster: [{u: [1.47, 3.07], z: [4.40, 5.90]}, {u: [5.29, 6.89], z: [4.40, 5.90]}, {u: [8.56, 10.16], z: [4.40, 5.90]}]}
    - {gruppe: nb_top3, rahmen: hof, a: [11.95, 6.62], b: [0.0, 6.62], z: [3.38, 6.78], wand: nb_wand_hof,        # Nord: Eingang, Bad (u = 11,95 - a)
       fenster: [{u: [4.24, 5.24], z: [3.50, 5.70], typ: tuer}, {u: [9.53, 10.96], z: [4.40, 5.90]}]}
    - {gruppe: nb_top3, rahmen: hof, a: [11.95, 0.0], b: [11.95, 6.62], z: [3.38, 6.78], wand: nb_wand_hof,       # Ost: Hebeschiebetuer zur Terrasse
       fenster: [{u: [3.32, 5.33], z: [3.50, 5.90], typ: hst}]}
    - {gruppe: nb_top3, rahmen: hof, a: [0.0, 6.62], b: [0.0, 0.0], z: [3.38, 6.78], wand: nb_wand_hof}           # West: geschlossen
    # --- Pavillon Top 4 [VP Top 4]
    - {gruppe: nb_top4, rahmen: hof, a: [16.04, 0.0], b: [27.99, 0.0], z: [3.38, 6.78], wand: nb_wand_hof,
       fenster: [{u: [1.17, 2.77], z: [4.40, 5.90]}, {u: [5.44, 7.04], z: [4.40, 5.90]}, {u: [8.83, 10.43], z: [4.40, 5.90]}]}
