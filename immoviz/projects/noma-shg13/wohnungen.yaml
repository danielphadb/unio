        openings: [{span: [4.236, 5.036], z: [0.0, 2.0], type: tuer}]
    boegen:
      - {c: [2.99, 3.856], r: [0.18, 0.28], winkel: [0, 90], z: [0, 3.38], mat: innen_wand}   # Runde 4: Trennwand-Rundung als Viertelkreis, R innen 0,18 / aussen 0,28 [INT S. 3]
