  # Eigene Koordinaten aus dem Moeblierungsplan 1:50 [INT S. 3]: X = von der Wand zum Strassenhaus nach rechts (0 bis 5,03),
  # Y = von der Fensterwand (Gartenstreifen Sued) Richtung Gang (0 bis 5,936). Lage: Hofrahmen a = -10,70 bis -5,67,
  # b = 0,35 bis 6,29 (erstes Apartment der Suedreihe, Tuer "01" laut [EIN S. 8]); drehung_grad und ursprung_lokal
  # setzen die Huelle in das Projektsystem (Ausblick auf Gartenstreifen, Zaun und Hofbau Schlachthausgasse 11).
  # Raumhoehe 3,38 m: FOK +-0,00, Rohdeckenunterkante +3,38 (Deckensprung auf +3,57 unter dem Strassenhaus nicht
  # modelliert), keine abgehaengte Decke (Betonkernaktivierung laut [BAB-A 3.10]). Fenster 1,70 m breit [INT S. 3],
  # Parapet 0,90 (FPH 0,90 laut [EIN S. 8]). Einbauten und Moebel nach [INT S. 3, 12 bis 16].
  # Runde 4 (Kunde 15.11.: Kueche zu klein, kein Stuck, Rot falsch, Ecke Bett/Gang): Hoehen der Wandeinbauten ueber das
  # Verhaeltnis zur Raumhoehe aus den Ansichten S. 13 bis 16, ergonomische Hoehen nach Standard; kein Stuck, nur
  # schlichte Vorhangvoute mit LED an der Fensterwand [S. 12 D, S. 14]; Trennwand als Wand mit Viertelkreis-Rundung.
