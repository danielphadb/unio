# immoviz Stufe 6: Innenraeume NOMA Schlachthausgasse 13 (Top 3, Top 4, Top 26-2)
# Top 3 und Top 4: Waende aus den Verkaufsplaenen [VP] (Vektor-PDF, 300 dpi, dunkelgruene Wandfuellung).
#   Massstab ueber die Pavillonmasse kalibriert: 11,95 m = 2355 px, 6,62 m = 1306 px -> 0,005072 m/px (rund 1:60).
#   Die Massleiste 0 bis 5 m auf dem Blatt entspricht in Wahrheit rund 6 m und wird NICHT verwendet.
#   Lage: Plan steht 6,44 Grad gedreht zum Lokalsystem (drehung_grad), Planecke = Suedwestecke aussen (ursprung_lokal),
#   aus [EIN S. 9] (1.OG Schlachthausgasse, 1:100, Pavillon Top 3 angeschnitten) und [VP Top 3] (Abstand Top 4 = 16,04 m).
# Top 26-2: kein verwertbarer Massstab im Verkaufsplan, daher von Hand (ManualApartment) aus [EIN S. 13] (2.DG, 1:100),
#   Koordinaten lokal (x entlang Schlachthausgasse, y Richtung Strasse), Raumhoehen aus den RH-Linien des Plans.
# Fensterhoehen Pavillons: Bruestung 0,90 (PH laut VP), Sturz 2,40 ueber FOK (160/150 laut [EIN S. 15]).

plaene:
  vp_top3: &vp_top3
    pdf: quellen/VP_Top03.pdf
    cache: vp_top03
    page: 1
    dpi: 300
    m_per_px: 0.005072
    cell_px: 3                       # Rasterzelle 1,5 cm
    corner_px: [1589, 2410]          # Suedwestecke aussen (Plan unten links)
    wand_farbe: "#4E604C"            # Wandfuellung im Verkaufsplan
    wand_toleranz: 30
    drehung_grad: 6.44
    ursprung_lokal: [5.058, -22.272]
  vp_top4: &vp_top4
    pdf: quellen/VP_Top04.pdf
    cache: vp_top04
    page: 1
    dpi: 300
    m_per_px: 0.005072
    cell_px: 3
    corner_px: [1636, 2410]
    wand_farbe: "#4E604C"
    wand_toleranz: 30
    drehung_grad: 6.44
    ursprung_lokal: [6.858, -38.210]  # Top 3 plus 16,04 m entlang der Pavillonreihe [VP Top 3]
  # Runde 3: gleiche Plaene fuer Terrassenbilder mit Innenraum hinter der offenen HST (top03_terrasse, top04_terrasse).
  # Huelle 2 cm entlang der Pavillonachse nach Westen versetzt, damit die Ostwand innen hinter der Aussenfassade liegt
  # (sonst deckungsgleiche Flaechen, Cycles-Artefakte). Versatz -0,02 * (0,1122, -0,9937).
  vp_top3_aussen: {<<: *vp_top3, ursprung_lokal: [5.0558, -22.2521]}
  vp_top4_aussen: {<<: *vp_top4, ursprung_lokal: [6.8558, -38.1901]}

# Innenraum-Lichtstimmungen (ergaenzen project.yaml lights)
lichter:
  spaetsommer_mittag: {date: "2026-08-27", time: "13:15", tz: 2, exposure: 0.0, interior: 0.0, aerosol: 2.0, season: spaetsommer}   # Sonne ca. 50 Grad aus Sued, fuer die Hofgauben Top 26

render:
  preview_resolution: [1200, 800]
  resolution: [2400, 1600]
  samples: 48

wohnungen:
  top03: &top03
    plan: vp_top3
    titel: Top 3, 1. OG Hof, 62,80 m2, Terrasse 20,91 m2 [VP]
