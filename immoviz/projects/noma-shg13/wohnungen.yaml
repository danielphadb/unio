      wohnkueche_vr:   {pos_px: [2950, 1250], target_px: [3870, 2330], lens: 18, h: 1.40}   # Runde 2: aus dem Vorraum durch die Oeffnung zu HST und Suedfenster
      wohnkueche_aussicht: {pos_px: [3180, 2318], target_px: [3945, 1557], lens: 20, h: 1.50}  # Runde 3: Suedwestecke, Blick durch die HST auf Terrasse und Innenhof
