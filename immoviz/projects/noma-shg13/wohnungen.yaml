      - {c: [2.72, 3.75], r: 0.18, z: [0, 0.45], mat: bordeaux_lack}   # Runde 4: Nachttisch-Hocker bordeaux rechts [INT S. 15/16]
    einbauten:
      - {rect: [0, 0, 5.03, 5.936], z: [0.004, 0.012], mat: boden_parkett}   # Bodenbelag ueber dem Gelaende (FOK +-0,00 = Gelaende)
