      - {c: [3.82, 0.916], r: 0.17, z: [0, 0.72], mat: hellblau}
      - {c: [3.98, 0.8], r: 0.165, z: [1.62, 1.68], mat: bordeaux_lack}   # Pendel bordeaux, Krempe 0,33, Unterkante 1.62 [INT S. 12 B, S. 13/14]
