    height: 3.38
    fenster_stil: modern
    drehung_grad: -83.56                  # Hofrahmen
    ursprung_lokal: [4.2057, -11.6003]    # Hofrahmen a = -10,70, b = 0,35 (Innenecke Fensterwand/Strassenhausseite)
    slab_rect: [-0.25, -0.35, 5.28, 6.19]
    walls:
      - rect: [-0.25, -0.35, 5.28, 0.0]                      # Fensterwand zum Gartenstreifen
        openings: [{span: [3.03, 4.73], z: [0.90, 2.40], type: fenster}]   # Hoehe 1,50 laut EIN S. 8 (FPH 0,90), Breite 1,70 laut INT S. 3
      - rect: [-0.25, 0.0, 0.0, 5.936]                       # Wand zum Strassenhaus
      - rect: [5.03, 0.0, 5.28, 5.936]                       # Wand zu APT. 02
      - rect: [-0.25, 5.936, 5.28, 6.186]                    # Gangwand mit Eingangstuer 90 x 200 [BAB-A 3.4]
        openings: [{span: [3.33, 4.23], z: [0.0, 2.05], type: tuer}]
      - rect: [0.0, 4.036, 2.99, 4.136]                      # Badwand, Richtung Eingang verlaengert bis Beginn der Rundung (Trennwand) [INT S. 3]
      - rect: [3.17, 3.30, 3.27, 3.856]                      # Runde 4: Trennwand-Arm Richtung Fenster, 10 cm, raumhoch, Ende y 3,30 [INT S. 3, S. 16]
