    rand_offen: true                 # Runde 3: keine Randwand am Ausschnitt (stand 1 m vor HST und Suedfenstern im Ausblick)
    light: spaetsommer
    exposure: 0.7
    kameras:
      wohnkueche:     {pos_px: [3250, 2290], target_px: [3985, 1480], lens: 24, h: 1.40}
      wohnkueche_sued: {pos_px: [3865, 1250], target_px: [3380, 2400], lens: 24, h: 1.35}
      schlafzimmer:   {pos_px: [2290, 1740], target_px: [1950, 2400], lens: 24, h: 1.20}
      wohnkueche_ecke: {pos_px: [3232, 2300], target_px: [3907, 1230], lens: 18, h: 1.40}
      wohnkueche_vr:   {pos_px: [2997, 1250], target_px: [3917, 2330], lens: 18, h: 1.40}
      wohnkueche_aussicht: {pos_px: [3227, 2318], target_px: [3992, 1577], lens: 20, h: 1.50}  # Runde 3
      wohnkueche_rueckwand: {pos_px: [3217, 1980], target_px: [3992, 1500], lens: 20, h: 1.50}  # Runde 3, Vorschlag (nicht veredelt)
  # Runde 3: Terrassenbilder mit Innenraum hinter der offenen Hebeschiebetuer. Aussenhuelle bleibt sichtbar, nur die
  # Innenraumkarte und das Aussenglas der Pavillons sind aus; Innenhuelle aus dem VP (2 cm versetzt, siehe plaene).
  # Kamera auf der Terrasse in Plan-Pixeln (Hofrahmen a = (px - corner_x) * 0,005072, b = (2410 - py) * 0,005072).
  top03_terrasse:
    <<: *top03
    plan: vp_top3_aussen
    objekt_ausblenden: [nb_top3_innen, nb_top3_glas]
    kameras:
      hst: {pos_px: [4684, 2144], target_px: [3945, 1444], lens: 18, h: 1.50, exposure: 0.0}   # Terrassenaussenecke SO (a 15,7 / b 1,35)
