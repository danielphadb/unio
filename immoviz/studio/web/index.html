<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>immoviz Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/app.css">
<script>try{var t=localStorage.getItem("immoviz-theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span><span class="label">immoviz Studio</span></a>

      <span class="label claim">Raum. Technologie. Mensch.</span>
      <span id="hfstat" class="tag" hidden></span>
      <button id="theme" class="small" type="button" aria-label="Farbthema wechseln"></button>
    </div>
  </div>
  <nav class="pnav" id="pnav" aria-label="Projektbereiche" hidden></nav>
  <main id="view" aria-live="polite"></main>
  <footer><span>immoviz Studio · Phase C · lokal</span><span>Alle Bilder: unverbindliche Visualisierung</span></footer>
</div>
<dialog id="dlg" aria-label="Bilddetail"></dialog>
<script src="/common.js"></script>
<script src="/editor.js"></script>
<script src="/fassade.js"></script>
<script src="/veredeln.js"></script>
<script src="/app.js"></script>
</body>
</html>
