# Automodelle aus BlenderKit / BlendKit (kostenlos, Lizenz je Eintrag), ausgewaehlt am 18.11.2026 vom Kunden (Chat).
# Die Dateien liegen NICHT im Repo: `immoviz.py autos-laden` holt sie nach immoviz/assets/autos/<id8>_<name>/
# (gitignored, rund 300 MB), `immoviz.py autos-bibliothek` baut daraus immoviz/assets/autos/bibliothek.blend
# (einheitlich: Front +X, Ursprung Mitte am Boden, echte Laenge, eigener Autolack, ohne Logos und Kennzeichen-Schrift).
# Lizenzen: royalty_free = BlenderKit Royalty Free (kommerziell nutzbar ohne Namensnennung, Weiterverkauf der Modelle
# verboten), cc_zero = CC0 1.0. Markenlogos, Embleme und Schriftzuege werden beim Bauen entfernt.
#
# Felder: id (asset_base_id), name, autor, lizenz, laenge_m (Herstellerangabe, auf diese Laenge wird skaliert;
# leer = Laenge des Modells), klasse (siehe verteilung), gewicht (Haeufigkeit innerhalb der Klassengruppe), optional
# vorne (+x/-x/+y/-y, wenn die Erkennung falsch liegt), lack (Materialnamen des Lacks, wenn die Namensregel nicht
# greift), weg (Objekt- oder Materialnamen, die entfernt werden).
#
# Verteilung (Runde 7 Korrektur, Kundenkritik an den 4k-Bildern: zu viele Oberklasse- und Sportwagen, Porsche, AMG GT, RS6): Wiener
# Wohnstrassen zeigen vor allem Alltagsautos. Je Stellplatz wird zuerst die Gruppe nach `anteil` gezogen, dann das
# Modell nach `gewicht`; Gruppen ohne passendes Modell fallen weg (Anteile werden neu verteilt). Sportwagen (klasse
# sport) stehen nie naeher als `sport_mindestabstand_m` an einer Strassenkamera (project.yaml cameras, Kamera bis
# 12 m ueber dem Gelaende). Gilt beim Szenenaufbau, die Bibliothek muss dafuer nicht neu gebaut werden.
verteilung:
  alltag:     {anteil: 0.70, klassen: [kleinwagen, kompakt, kombi, mittelklasse]}
  suv_van:    {anteil: 0.20, klassen: [suv, van]}
  oberklasse: {anteil: 0.10, klassen: [oberklasse, sport]}
sport_mindestabstand_m: 15
