<style>
:root{--bg:#F7F5F1;--ink:#0B0A09;--muted:rgba(27,26,22,.62);--line:rgba(11,10,9,.14);--signal:#FFAA09}
@media (prefers-color-scheme:dark){:root{--bg:#0B0A09;--ink:#F7F5F1;--muted:rgba(247,245,241,.62);--line:rgba(255,255,255,.14)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Helvetica Neue",Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:32px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}

figcaption{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.dl{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:14px}
</style></head><body><main>
